interface:
  display_name: "科研 PPT 制作"
  short_description: "自行检索论文或项目，制作 Claude 式克制风格的科研 PPT：按论文理解难度讲清背景、方法机制、训练目标与证据，标题页附论文首页"
  default_prompt: "用 $research-ppt-maker 根据论文或项目自行检索并制作科研 PPT：普通单篇论文约 4–5 页，复杂机制按需要增加讲解页（标题页含论文首页截图，重点包含方法计算、训练目标、关键创新与证据），用 build_deck.py 的象牙白—陶土色版式，用自然中文讲清输入—操作—输出及实验对照，严禁堆砌审稿栏目与抽象术语，只交付 PPT，不要讲稿。"
