interface:
  display_name: "科研 PPT 制作"
  short_description: "自行检索论文或项目，制作 Claude 式克制风格的科研 PPT：按论文理解难度讲清背景、方法机制、训练目标与证据，标题页附论文首页"
  default_prompt: "用 $research-ppt-maker 根据论文或项目自行检索并制作科研 PPT。按论文类型与组会时间分配主次和页数：两篇重点模型+辅助综述默认合计约 9–11 页；论文标题页含首页截图。先讲必要背景，再优先展示论文原始完整模型图并指出核心创新，后续用自制局部示意深讲关键模块，常规组会优先精选 1–2 项有判别力的实验证据，用户指定深度或范围时按要求调整；综述区分概念框架与引用研究。沿用象牙白—陶土色视觉风格，按内容选通用或自定义可编辑布局，用自然中文解释图示与实验对照。默认只讲论文，不自动添加用户项目进展或下一步；用户明确要求时才另设真实实验模块，并核对数据划分、基线和来源。用正式自然中文定义术语与符号，最终 PPTX 必须复查口语化表达。只交付 PPT，不要讲稿。"
