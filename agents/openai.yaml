interface:
  display_name: "科研 PPT 制作"
  short_description: "自行检索论文或项目，制作 Claude 式克制风格的科研 PPT：按论文理解难度讲清背景、方法机制、训练目标与证据，标题页附论文首页"
  default_prompt: "用 $research-ppt-maker 根据论文或项目自行检索并制作科研 PPT。按论文类型、受众与理解难度规划，简单单篇可从 4–5 页开始；论文标题页含首页截图。讲清背景、核心思路、主要贡献与证据，模型论文深入关键计算，综述区分概念框架与引用研究。沿用象牙白—陶土色视觉风格，按内容选通用或自定义可编辑布局，用自然中文解释图示与实验对照。只交付 PPT，不要讲稿。"
